<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>cl-matplotlib</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #f4f4f4; }
  #toolbar {
    display: flex; align-items: center; gap: 8px;
    padding: 6px 10px; background: #e8e8e8; border-bottom: 1px solid #ccc;
  }
  #toolbar button {
    padding: 4px 14px; border: 1px solid #aaa; border-radius: 4px;
    background: #fff; cursor: pointer; font-size: 13px;
  }
  #toolbar button:hover { background: #f0f0f0; }
  #coords {
    margin-left: auto; font-family: monospace; font-size: 13px; color: #333;
    min-width: 22ch; text-align: right;
  }
  #status { font-size: 12px; color: #a00; }
  #hint { font-size: 12px; color: #666; border: 1px solid #bbb; border-radius: 50%; padding: 0 6px; cursor: help; }
  #tabs { display: flex; gap: 2px; padding: 4px 8px 0; background: #ddd; border-bottom: 1px solid #bbb; }
  .tab {
    display: flex; align-items: center; gap: 6px; padding: 5px 10px; font-size: 13px;
    background: #e9e9e9; border: 1px solid #bbb; border-bottom: none; border-radius: 6px 6px 0 0; cursor: pointer;
  }
  .tab.active { background: #fff; font-weight: 600; }
  .tab .close { color: #888; font-size: 12px; padding: 0 2px; }
  .tab .close:hover { color: #a00; }
  #empty { padding: 24px; color: #666; }
  #fig-wrap { padding: 8px; }
  canvas { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.25); cursor: crosshair; display: none; }
  canvas.active { display: block; }
  body.cursor-mode canvas { cursor: cell; }
</style>
</head>
<body>
<div id="toolbar">
  <button id="home" title="Reset view (h, or double-click the plot)">Home</button>
  <button id="save" title="Download the current frame as PNG">Save</button>
  <button id="cursor" title="Data cursor mode: click a point to pin its value (c); Escape clears">Cursor</button>
  <button id="undo" title="Undo (ctrl-z)">Undo</button>
  <button id="redo" title="Redo (ctrl-shift-z)">Redo</button>
  <button id="new" title="New empty figure in a new tab">New</button>
  <button id="closetab" title="Close this figure's tab (ctrl-w)">Close</button>
  <span id="hint" title="Click a trace to select it; ctrl-c / ctrl-x / ctrl-v copy, cut and paste traces between figures and tabs; Delete removes; click a legend entry to hide or show its series; drag a 3D plot to rotate it, shift-drag to pan.">?</span>
  <span id="status"></span>
  <span id="coords"></span>
</div>
<div id="tabs"></div>
<div id="empty" hidden>No figures. Call (show) from the REPL, or press New.</div>
<div id="fig-wrap"></div>
<script src="/app.js"></script>
</body>
</html>
